name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.12.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit & Accessibility Tests
        run: pnpm run test

      - name: Build Packages & Apps
        run: pnpm run build

      - name: Package Validation (publint)
        run: |
          cd packages/react
          pnpm dlx publint

      - name: Package Type Resolution (@arethetypeswrong/cli)
        run: |
          cd packages/react
          pnpm dlx @arethetypeswrong/cli --pack .

      - name: Bundle Size Budget Verification
        run: |
          cd packages/react
          pnpm run size

      - name: Test Consumer Verification
        run: |
          cd apps/test-consumer
          pnpm run test
